<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Late Coming Calculator</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f9;
}

.container{
    width:500px;
    margin:40px auto;
    background:#fff;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#007bff;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:18px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:8px;
}

input,select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#007bff;
    color:#fff;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#eef8ff;
    border-left:5px solid #007bff;
    display:none;
}
</style>

</head>
<body>

<div class="container">

<h2>Late Coming Calculator</h2>

<div class="form-group">
<label>Number of Late Comings</label>
<input type="number" id="lateCount" min="0" placeholder="Enter Late Comings">
</div>

<div class="form-group">
<label>Deduction Type</label>
<select id="deduction">
<option value="0.5">Half Day (0.5)</option>
<option value="1">Full Day (1)</option>
</select>
</div>

<button onclick="calculate()">Calculate</button>

<div class="result" id="result"></div>

</div>

<script>

function calculate(){

let late=parseInt(document.getElementById("lateCount").value)||0;

let deduction=parseFloat(document.getElementById("deduction").value);

let total=Math.floor(late/3)*deduction;

let remaining=late%3;

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=`
<h3>Calculation</h3>

<b>Late Comings :</b> ${late}<br><br>

<b>Deduction :</b> ${total} Day(s)<br><br>

<b>Remaining Late Comings :</b> ${remaining}

`;

}

</script>

</body>
</html>
