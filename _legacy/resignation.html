<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Resignation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f4f7fb;
            font-family: Arial, Helvetica, sans-serif;
            color: #263238;
        }

        .resignation-container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #e1e6ed;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        /* Header */
        .form-header {
            padding: 22px 28px;
            border-bottom: 1px solid #e5e9ef;
            background: #ffffff;
        }

        .form-header h2 {
            margin: 0 0 5px;
            font-size: 20px;
            font-weight: 600;
            color: #1f2937;
        }

        .form-header p {
            margin: 0;
            font-size: 13px;
            color: #7b8794;
        }

        /* Sections */
        .form-section {
            padding: 24px 28px;
            border-bottom: 1px solid #e9edf2;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .section-title h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            color: #344054;
        }

        .section-number {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #eef2ff;
            color: #4f46e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        /* Grid */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: #475467;
            margin-bottom: 7px;
        }

        label .required {
            color: #e53935;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #d8dee8;
            border-radius: 5px;
            padding: 10px 12px;
            font-size: 13px;
            color: #344054;
            background: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input,
        select {
            height: 40px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.10);
        }

        input[readonly] {
            background: #f8fafc;
            color: #667085;
        }

        /* Employee search */
        .employee-select {
            position: relative;
        }

        .employee-select input {
            padding-right: 40px;
        }

        .search-icon {
            position: absolute;
            right: 13px;
            top: 12px;
            color: #98a2b3;
            font-size: 14px;
        }

        /* Status */
        .status-box {
            display: flex;
            align-items: center;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #d8dee8;
            border-radius: 5px;
            background: #f8fafc;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: #e8f5e9;
            color: #2e7d32;
        }

        /* Radio buttons */
        .radio-group {
            display: flex;
            gap: 25px;
            align-items: center;
            height: 40px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            color: #475467;
            cursor: pointer;
        }

        .radio-option input {
            width: 15px;
            height: 15px;
            margin: 0;
            accent-color: #4f46e5;
        }

        /* Notice information */
        .notice-info {
            margin-top: 20px;
            padding: 14px 16px;
            background: #f8f9fc;
            border: 1px solid #e6e9ef;
            border-radius: 6px;
        }

        .notice-info-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #475467;
        }

        .notice-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .notice-item span {
            display: block;
        }

        .notice-label {
            font-size: 11px;
            color: #98a2b3;
            margin-bottom: 4px;
        }

        .notice-value {
            font-size: 13px;
            font-weight: 600;
            color: #344054;
        }

        /* Footer */
        .form-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 18px 28px;
            background: #fafbfc;
        }

        button {
            height: 40px;
            padding: 0 20px;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: #ffffff;
            color: #475467;
            border: 1px solid #d0d5dd;
        }

        .btn-submit {
            background: #4f46e5;
            color: #ffffff;
        }

        .btn-submit:hover {
            background: #4338ca;
        }

        .btn-cancel:hover {
            background: #f8fafc;
        }

        /* Responsive */
        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full-width {
                grid-column: auto;
            }

            .notice-details {
                grid-template-columns: 1fr;
            }

            .form-section,
            .form-header,
            .form-footer {
                padding-left: 18px;
                padding-right: 18px;
            }
        }
    </style>
</head>

<body>

<div class="resignation-container">

    <!-- Header -->
    <div class="form-header">
        <h2>Employee Resignation</h2>
        <p>Submit and process an employee resignation request</p>
    </div>

    <!-- Employee Information -->
    <div class="form-section">

        <div class="section-title">
            <div class="section-number">1</div>
            <h3>Employee Information</h3>
        </div>

        <div class="form-grid">

            <div class="form-group full-width">
                <label>
                    Employee <span class="required">*</span>
                </label>

                <div class="employee-select">
                    <input
                        type="text"
                        placeholder="Search employee..."
                        id="employeeSearch"
                    >
                    <span class="search-icon">⌕</span>
                </div>
            </div>

            <div class="form-group">
                <label>Employee ID</label>
                <input type="text" id="employeeId" readonly>
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" id="department" readonly>
            </div>

            <div class="form-group">
                <label>Designation</label>
                <input type="text" id="designation" readonly>
            </div>

            <div class="form-group">
                <label>Date of Joining</label>
                <input type="text" id="joiningDate" readonly>
            </div>

            <div class="form-group">
                <label>Employment Status</label>

                <div class="status-box">
                    <span class="status-badge">Confirmed</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Resignation Details -->
    <div class="form-section">

        <div class="section-title">
            <div class="section-number">2</div>
            <h3>Resignation Details</h3>
        </div>

        <div class="form-grid">

            <div class="form-group">
                <label>
                    Resignation Date <span class="required">*</span>
                </label>

                <input type="date" id="resignationDate">
            </div>

            <div class="form-group">
                <label>Notice Period</label>
                <input
                    type="text"
                    id="noticePeriod"
                    value="30 Days"
                    readonly
                >
            </div>

            <div class="form-group">
                <label>Notice Period Start Date</label>
                <input type="date" id="noticeStartDate" readonly>
            </div>

            <div class="form-group">
                <label>Proposed Last Working Date</label>
                <input type="date" id="lastWorkingDate">
            </div>

            <div class="form-group">
                <label>Notice Period Served</label>

                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="noticeServed" value="yes">
                        Yes
                    </label>

                    <label class="radio-option">
                        <input type="radio" name="noticeServed" value="no">
                        No
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Exit Type</label>
                <select id="exitType">
                    <option value="resignation">Resignation</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label>
                    Reason for Resignation <span class="required">*</span>
                </label>

                <select id="reason">
                    <option value="">Select reason</option>
                    <option>Better Opportunity</option>
                    <option>Personal Reasons</option>
                    <option>Relocation</option>
                    <option>Higher Studies</option>
                    <option>Health / Family Reasons</option>
                    <option>Career Change</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label>Resignation Remarks</label>

                <textarea
                    id="remarks"
                    placeholder="Enter additional details about the resignation..."
                ></textarea>
            </div>

        </div>

        <!-- Notice information -->
        <div class="notice-info">

            <div class="notice-info-title">
                Notice Period Information
            </div>

            <div class="notice-details">

                <div class="notice-item">
                    <span class="notice-label">
                        Notice Period
                    </span>

                    <span class="notice-value">
                        30 Days
                    </span>
                </div>

                <div class="notice-item">
                    <span class="notice-label">
                        Notice Start
                    </span>

                    <span class="notice-value" id="noticeDisplay">
                        —
                    </span>
                </div>

                <div class="notice-item">
                    <span class="notice-label">
                        Last Working Date
                    </span>

                    <span class="notice-value" id="lastWorkingDisplay">
                        —
                    </span>
                </div>

            </div>
        </div>

    </div>

    <!-- Admin / HR -->
    <div class="form-section">

        <div class="section-title">
            <div class="section-number">3</div>
            <h3>HR / Admin Remarks</h3>
        </div>

        <div class="form-grid">

            <div class="form-group full-width">
                <label>Admin Remarks</label>

                <textarea
                    id="adminRemarks"
                    placeholder="Enter HR or admin remarks..."
                ></textarea>
            </div>

        </div>

    </div>

    <!-- Footer -->
    <div class="form-footer">

        <button
            type="button"
            class="btn-cancel"
            onclick="window.history.back()"
        >
            Cancel
        </button>

        <button
            type="button"
            class="btn-submit"
            onclick="submitResignation()"
        >
            Submit Resignation
        </button>

    </div>

</div>


<script>

    // Automatically set resignation date to today
    const resignationDate = document.getElementById("resignationDate");

    const today = new Date();

    const todayString =
        today.getFullYear() +
        "-" +
        String(today.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(today.getDate()).padStart(2, "0");

    resignationDate.value = todayString;


    // Calculate notice period
    resignationDate.addEventListener("change", calculateLastWorkingDate);


    function calculateLastWorkingDate() {

        const dateValue = resignationDate.value;

        if (!dateValue) {
            return;
        }

        const startDate = new Date(dateValue);

        const lastDate = new Date(startDate);

        // Example: 30-day notice period
        lastDate.setDate(lastDate.getDate() + 30);

        const formattedDate =
            lastDate.getFullYear() +
            "-" +
            String(lastDate.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(lastDate.getDate()).padStart(2, "0");

        document.getElementById("noticeStartDate").value =
            dateValue;

        document.getElementById("lastWorkingDate").value =
            formattedDate;

        document.getElementById("noticeDisplay").textContent =
            formatDate(dateValue);

        document.getElementById("lastWorkingDisplay").textContent =
            formatDate(formattedDate);
    }


    function formatDate(date) {

        if (!date) {
            return "—";
        }

        const parts = date.split("-");

        return parts[2] + "/" + parts[1] + "/" + parts[0];
    }


    function submitResignation() {

        const employee =
            document.getElementById("employeeSearch").value;

        const reason =
            document.getElementById("reason").value;

        const resignation =
            document.getElementById("resignationDate").value;

        if (!employee) {
            alert("Please select an employee.");
            return;
        }

        if (!resignation) {
            alert("Please select the resignation date.");
            return;
        }

        if (!reason) {
            alert("Please select the resignation reason.");
            return;
        }

        alert("Resignation submitted successfully.");

        // Connect this button to your Laravel endpoint here.
    }

</script>

</body>
</html>
