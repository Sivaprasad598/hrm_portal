<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Department & Employee Selection</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f6f6f6;
    color: #333;
}

/* HEADER */

.header {
    height: 70px;
    background: #fff;
    border-bottom: 1px solid #e5e5e5;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 35px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-box {
    width: 40px;
    height: 40px;

    background: #f4ac83;
    color: white;

    border-radius: 8px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
    font-weight: bold;
}

.logo-text {
    font-size: 18px;
    font-weight: 600;
    color: #555;
}

.user {
    width: 40px;
    height: 40px;

    border-radius: 50%;

    background: #f4ac83;

    display: flex;
    align-items: center;
    justify-content: center;

    font-weight: bold;
}

/* MAIN */

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

/* PAGE HEADER */

.page-header {
    background: white;

    border: 1px solid #e5e5e5;

    border-radius: 10px;

    padding: 25px;

    margin-bottom: 20px;
}

.page-header h1 {
    font-size: 22px;
    margin-bottom: 7px;
}

.page-header p {
    font-size: 13px;
    color: #888;
}

/* CARD */

.card {
    background: white;

    border: 1px solid #e3e3e3;

    border-radius: 10px;

    padding: 25px;
}

/* FORM */

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;

    font-size: 13px;

    font-weight: 600;

    color: #555;

    margin-bottom: 8px;
}

.required {
    color: #d9534f;
}

select {
    width: 100%;

    height: 45px;

    border: 1px solid #ddd;

    border-radius: 6px;

    padding: 0 12px;

    font-size: 13px;

    outline: none;

    background: white;

    cursor: pointer;
}

select:focus {
    border-color: #f4ac83;

    box-shadow: 0 0 0 3px rgba(244,172,131,.15);
}

/* EMPLOYEE SECTION */

.employee-section {
    display: none;

    margin-top: 25px;

    border-top: 1px solid #eee;

    padding-top: 25px;
}

.employee-section.show {
    display: block;
}

.employee-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    margin-bottom: 15px;
}

.employee-title {
    font-size: 14px;

    font-weight: 600;

    white-space: nowrap;
}

/* EMPLOYEE SEARCH */

.employee-search {
    width: 330px;

    position: relative;
}

.employee-search input {
    width: 100%;

    height: 40px;

    border: 1px solid #ddd;

    border-radius: 6px;

    padding: 0 12px 0 38px;

    font-size: 12px;

    outline: none;
}

.employee-search input:focus {
    border-color: #f4ac83;

    box-shadow: 0 0 0 3px rgba(244,172,131,.12);
}

.search-icon {
    position: absolute;

    left: 13px;

    top: 11px;

    color: #999;

    font-size: 14px;
}

/* EMPLOYEE COUNT */

.employee-count {
    font-size: 11px;

    color: #999;

    margin-bottom: 12px;
}

/* EMPLOYEES */

.employee-list {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 12px;
}

.employee-card {
    border: 1px solid #ddd;

    border-radius: 8px;

    padding: 15px;

    cursor: pointer;

    transition: .2s;

    background: white;
}

.employee-card:hover {
    border-color: #f4ac83;

    background: #fffaf7;
}

.employee-card.selected {
    border-color: #f4ac83;

    background: #fff1e8;

    box-shadow: 0 0 0 1px #f4ac83;
}

.employee-name {
    font-size: 13px;

    font-weight: 600;

    margin-bottom: 7px;
}

.employee-card-id {
    font-size: 11px;

    color: #777;

    margin-bottom: 5px;
}

.employee-designation {
    font-size: 11px;

    color: #999;
}

/* EMPTY */

.empty-message {
    display: none;

    padding: 20px;

    text-align: center;

    background: #fafafa;

    border: 1px dashed #ddd;

    border-radius: 7px;

    font-size: 12px;

    color: #999;
}

/* BUTTON */

.button-area {
    margin-top: 25px;

    display: flex;

    justify-content: flex-end;
}

.submit-btn {
    border: none;

    background: #f4ac83;

    color: #222;

    padding: 12px 25px;

    border-radius: 6px;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;
}

.submit-btn:hover {
    background: #e59768;
}

/* RESULT */

.result {
    display: none;

    margin-top: 20px;

    background: #fff8f4;

    border: 1px solid #f0d4c3;

    border-radius: 8px;

    padding: 20px;
}

.result.show {
    display: block;
}

.result-title {
    font-size: 14px;

    font-weight: 600;

    margin-bottom: 15px;

    color: #555;
}

.result-row {
    display: flex;

    justify-content: space-between;

    padding: 9px 0;

    border-bottom: 1px solid #f1ded4;

    font-size: 12px;
}

.result-row:last-child {
    border-bottom: none;
}

.result-label {
    color: #888;
}

.result-value {
    font-weight: 600;

    color: #333;
}

/* RESPONSIVE */

@media(max-width: 800px) {

    .employee-header {
        flex-direction: column;

        align-items: stretch;
    }

    .employee-search {
        width: 100%;
    }

    .employee-list {
        grid-template-columns: 1fr;
    }

    .header {
        padding: 0 15px;
    }

    .container {
        margin-top: 20px;
    }
}

</style>
</head>

<body>


<!-- HEADER -->

<header class="header">

    <div class="logo">

        <div class="logo-box">
            A
        </div>

        <div class="logo-text">
            AROWANA
        </div>

    </div>


    <div class="user">
        PN
    </div>

</header>


<!-- MAIN -->

<div class="container">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <h1>
            Department & Employee Selection
        </h1>

        <p>
            Select a department and choose an employee
            by searching their name or Card ID.
        </p>

    </div>


    <!-- CARD -->

    <div class="card">


        <!-- DEPARTMENT -->

        <div class="form-group">

            <label>
                Department
                <span class="required">*</span>
            </label>


            <select id="department">

                <option value="">
                    Select Department
                </option>

                <option value="IT">
                    IT Department
                </option>

                <option value="HR">
                    Human Resources
                </option>

                <option value="Finance">
                    Finance
                </option>

                <option value="Administration">
                    Administration
                </option>

                <option value="Operations">
                    Operations
                </option>

            </select>

        </div>


        <!-- EMPLOYEE SECTION -->

        <div
            class="employee-section"
            id="employeeSection">


            <!-- EMPLOYEE HEADER -->

            <div class="employee-header">


                <div class="employee-title">
                    Employees
                </div>


                <!-- SEARCH -->

                <div class="employee-search">

                    <span class="search-icon">
                        🔍
                    </span>

                    <input
                        type="text"
                        id="employeeSearch"
                        placeholder="Search by Employee Name or Card ID">

                </div>


            </div>


            <!-- COUNT -->

            <div
                class="employee-count"
                id="employeeCount">

            </div>


            <!-- EMPLOYEE LIST -->

            <div
                class="employee-list"
                id="employeeList">

            </div>


            <!-- NO RESULT -->

            <div
                class="empty-message"
                id="emptyMessage">

                No employees found.

            </div>


        </div>


        <!-- SUBMIT -->

        <div class="button-area">

            <button
                type="button"
                class="submit-btn"
                id="submitBtn">

                Submit

            </button>

        </div>


    </div>


    <!-- RESULT -->

    <div
        class="result"
        id="result">


        <div class="result-title">
            Submitted Information
        </div>


        <div class="result-row">

            <span class="result-label">
                Department
            </span>

            <span
                class="result-value"
                id="resultDepartment">

            </span>

        </div>


        <div class="result-row">

            <span class="result-label">
                Employee Name
            </span>

            <span
                class="result-value"
                id="resultEmployee">

            </span>

        </div>


        <div class="result-row">

            <span class="result-label">
                Card ID
            </span>

            <span
                class="result-value"
                id="resultCardId">

            </span>

        </div>


        <div class="result-row">

            <span class="result-label">
                Designation
            </span>

            <span
                class="result-value"
                id="resultDesignation">

            </span>

        </div>


    </div>


</div>


<script>

/* =====================================================
   EMPLOYEE DATA
===================================================== */

const employees = {

    IT: [

        {
            cardId: "3006618",
            name: "Prudhvi Narayana",
            designation: "Software Developer"
        },

        {
            cardId: "3006619",
            name: "Rahul Kumar",
            designation: "Full Stack Developer"
        },

        {
            cardId: "3006620",
            name: "Anil Kumar",
            designation: "Software Engineer"
        },

        {
            cardId: "3006621",
            name: "Suresh Reddy",
            designation: "Cloud Developer"
        }

    ],


    HR: [

        {
            cardId: "3006622",
            name: "Priya Sharma",
            designation: "HR Manager"
        },

        {
            cardId: "3006623",
            name: "Kavya Reddy",
            designation: "HR Executive"
        },

        {
            cardId: "3006624",
            name: "Sneha Rao",
            designation: "Recruiter"
        }

    ],


    Finance: [

        {
            cardId: "3006625",
            name: "Ramesh Kumar",
            designation: "Accountant"
        },

        {
            cardId: "3006626",
            name: "Vijay Rao",
            designation: "Finance Executive"
        }

    ],


    Administration: [

        {
            cardId: "3006627",
            name: "Mahesh Kumar",
            designation: "Admin Manager"
        },

        {
            cardId: "3006628",
            name: "Ravi Teja",
            designation: "Admin Executive"
        }

    ],


    Operations: [

        {
            cardId: "3006629",
            name: "Arun Kumar",
            designation: "Operations Manager"
        },

        {
            cardId: "3006630",
            name: "Naveen Reddy",
            designation: "Operations Executive"
        }

    ]

};


/* =====================================================
   VARIABLES
===================================================== */

let selectedEmployee = null;

let currentEmployees = [];


/* =====================================================
   ELEMENTS
===================================================== */

const department =
    document.getElementById("department");

const employeeSection =
    document.getElementById("employeeSection");

const employeeSearch =
    document.getElementById("employeeSearch");

const employeeList =
    document.getElementById("employeeList");

const employeeCount =
    document.getElementById("employeeCount");

const emptyMessage =
    document.getElementById("emptyMessage");

const submitBtn =
    document.getElementById("submitBtn");


/* =====================================================
   DEPARTMENT CHANGE
===================================================== */

department.addEventListener(
    "change",
    function(){

        const selectedDepartment =
            this.value;


        selectedEmployee = null;


        employeeSearch.value = "";


        employeeList.innerHTML = "";


        document
            .getElementById("result")
            .classList.remove("show");


        if(!selectedDepartment){

            employeeSection
                .classList
                .remove("show");

            return;

        }


        employeeSection
            .classList
            .add("show");


        currentEmployees =
            employees[selectedDepartment] || [];


        renderEmployees(
            currentEmployees
        );

    }
);


/* =====================================================
   RENDER EMPLOYEES
===================================================== */

function renderEmployees(employeeData){

    employeeList.innerHTML = "";


    employeeCount.textContent =
        employeeData.length +
        " employee" +
        (employeeData.length !== 1 ? "s" : "") +
        " found";


    if(employeeData.length === 0){

        emptyMessage.style.display =
            "block";

        return;

    }


    emptyMessage.style.display =
        "none";


    employeeData.forEach(
        function(employee){

            const card =
                document.createElement("div");


            card.className =
                "employee-card";


            /*
             * Keep selected employee highlighted
             * when searching.
             */

            if(
                selectedEmployee &&
                selectedEmployee.cardId ===
                employee.cardId
            ){

                card.classList.add(
                    "selected"
                );

            }


            card.innerHTML = `

                <div class="employee-name">
                    ${escapeHTML(employee.name)}
                </div>

                <div class="employee-card-id">
                    Card ID: ${escapeHTML(employee.cardId)}
                </div>

                <div class="employee-designation">
                    ${escapeHTML(employee.designation)}
                </div>

            `;


            card.addEventListener(
                "click",
                function(){

                    /*
                     * Remove previous selection
                     */

                    document
                        .querySelectorAll(
                            ".employee-card"
                        )
                        .forEach(
                            function(item){

                                item.classList.remove(
                                    "selected"
                                );

                            }
                        );


                    /*
                     * Select current
                     */

                    card.classList.add(
                        "selected"
                    );


                    selectedEmployee =
                        employee;

                }
            );


            employeeList.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   EMPLOYEE SEARCH
===================================================== */

employeeSearch.addEventListener(
    "input",
    function(){

        const search =
            this.value
                .trim()
                .toLowerCase();


        /*
         * If search is empty,
         * show all employees.
         */

        if(!search){

            renderEmployees(
                currentEmployees
            );

            return;

        }


        /*
         * Search by:
         *
         * 1. Employee Name
         * 2. Card ID
         */

        const filteredEmployees =
            currentEmployees.filter(
                function(employee){

                    const name =
                        employee.name
                            .toLowerCase();


                    const cardId =
                        employee.cardId
                            .toLowerCase();


                    return (
                        name.includes(search) ||
                        cardId.includes(search)
                    );

                }
            );


        renderEmployees(
            filteredEmployees
        );

    }
);


/* =====================================================
   SUBMIT
===================================================== */

submitBtn.addEventListener(
    "click",
    function(){

        const selectedDepartment =
            department.value;


        if(!selectedDepartment){

            alert(
                "Please select a department."
            );

            return;

        }


        if(!selectedEmployee){

            alert(
                "Please select an employee."
            );

            return;

        }


        /*
         * DISPLAY RESULT
         */

        document.getElementById(
            "resultDepartment"
        ).textContent =
            selectedDepartment;


        document.getElementById(
            "resultEmployee"
        ).textContent =
            selectedEmployee.name;


        document.getElementById(
            "resultCardId"
        ).textContent =
            selectedEmployee.cardId;


        document.getElementById(
            "resultDesignation"
        ).textContent =
            selectedEmployee.designation;


        document.getElementById(
            "result"
        ).classList.add("show");


        /*
         * Scroll to result
         */

        document.getElementById(
            "result"
        ).scrollIntoView({
            behavior:"smooth",
            block:"center"
        });

    }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
